<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e6ebf1">
  <title>IELTS Spelling Practice</title>
  <meta name="description" content="Free IELTS spelling practice: listen to 2,300+ high-frequency IELTS words, type them, and learn their meanings, synonyms and antonyms.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <h1 class="title">IELTS Spelling Practice</h1>
    <p class="stats" id="stats"></p>
  </header>

  <main class="main">
    <section class="toolbar" aria-label="Choose words">
      <div class="filters">
        <select id="top" aria-label="Word list">
          <option value="100">Top 100</option>
          <option value="500">Top 500</option>
          <option value="1000">Top 1,000</option>
          <option value="1500">Top 1,500</option>
          <option value="all">All words</option>
        </select>
        <select id="topic" aria-label="Topic"></select>
        <select id="level" aria-label="CEFR level">
          <option value="all">All levels</option>
          <option value="A1">A1 · Beginner</option>
          <option value="A2">A2 · Elementary</option>
          <option value="B1">B1 · Intermediate</option>
          <option value="B2">B2 · Upper-intermediate</option>
          <option value="C1">C1 · Advanced</option>
          <option value="C2">C2 · Proficient</option>
        </select>
        <select id="status" aria-label="Show">
          <option value="all">Any status</option>
          <option value="new">New words</option>
          <option value="weak">My mistakes</option>
          <option value="notmastered">Not mastered</option>
        </select>
        <select id="order" aria-label="Order">
          <option value="rank">Top first</option>
          <option value="random">Random</option>
          <option value="alpha">A to Z</option>
        </select>
        <button class="gear" id="settingsBtn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.1-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
          <span class="gear-label">Settings</span>
        </button>
      </div>
      <div class="settings" id="settings" hidden>
        <label class="field">
          <span>Words at a time</span>
          <select id="count">
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
        <label class="field">
          <span>Mistakes allowed</span>
          <select id="maxMistakes">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="7">7</option>
            <option value="10">10</option>
            <option value="0">Unlimited</option>
          </select>
        </label>
        <label class="field">
          <span>Show wrong letter</span>
          <select id="wrongMs">
            <option value="0">Don't show</option>
            <option value="300">0.3 s</option>
            <option value="500">0.5 s</option>
            <option value="1000">1 s</option>
            <option value="2000">2 s</option>
          </select>
        </label>
        <label class="field">
          <span>Voice</span>
          <select id="voice"></select>
        </label>
        <label class="field">
          <span>Speed</span>
          <select id="rate">
            <option value="0.6">Slow</option>
            <option value="0.85">Normal</option>
            <option value="1">Fast</option>
          </select>
        </label>
        <div class="settings-actions">
          <button class="link" id="exportBtn" type="button">Export PDF</button>
          <button class="link" id="resetBtn" type="button">Reset progress</button>
          <button class="link danger" id="resetAllBtn" type="button">Reset all</button>
        </div>
      </div>
    </section>

    <p class="list-info" id="listInfo"></p>

    <section class="rows" id="rows"></section>

    <div class="more">
      <button class="btn" id="moreBtn" type="button">Show more</button>
      <button class="btn" id="shuffleBtn" type="button">New random set</button>
    </div>
  </main>

  <footer class="footer">
    <p class="saved-note">Your progress and settings are saved in this browser only.</p>
    <p class="credits">
      Definitions from <a href="https://en.wiktionary.org" rel="noopener" target="_blank">Wiktionary</a> (CC BY-SA)
      via <a href="https://dictionaryapi.dev" rel="noopener" target="_blank">Free Dictionary API</a> and from
      <a href="https://wordnet.princeton.edu" rel="noopener" target="_blank">WordNet</a>.
      CEFR levels from the <a href="https://github.com/openlanguageprofiles/olp-en-cefrj" rel="noopener" target="_blank">CEFR-J and Octanove vocabulary profiles</a> (CC BY-SA 4.0).
    </p>
  </footer>

  <script src="data/words.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
